<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
</head>
<body>

<h2>Diabetes Prediction Form</h2>

<form action="/predict" method="post">

<input type="number" name="Pregnancies" placeholder="Pregnancies" min="0" step="1" required><br>

<input type="number" name="Glucose" placeholder="Glucose" min="0" step="1" required><br>

<input type="number" name="BloodPressure" placeholder="Blood Pressure" min="0" step="1" required><br>

<input type="number" name="SkinThickness" placeholder="Skin Thickness" min="0" step="1" required><br>

<input type="number" name="Insulin" placeholder="Insulin" min="0" step="1" required><br>

<input type="number" step="0.01" name="BMI" placeholder="BMI" min="0" required><br>

<input type="number" step="0.01" name="DiabetesPedigreeFunction" placeholder="DPF" min="0" required><br>

<input type="number" name="Age" placeholder="Age" min="0" step="1" required><br><br>

<button type="submit">Predict</button>

</form>

{% if prediction %}
<h3>Result: {{ prediction }}</h3>
{% endif %}

</body>
</html>
